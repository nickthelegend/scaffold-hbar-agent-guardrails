name: agent-guardrails-smoke
server:
  command: yarn next:start
  url: http://localhost:3000
  timeoutMs: 180000
defaults:
  timeoutMs: 45000
  failOnConsoleError: false
routes:
  - name: landing
    path: /
  - name: debug-contracts
    path: /debug
  - name: health
    path: /api/health
forbidden:
  visibleText:
    - "Application error"
    - "Unhandled Runtime Error"
    - "is not deployed on this network"
