[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
fs_permissions = [
    { access = "read-write", path = "deployments" },
    { access = "read-write", path = "./" }
]
ffi = true
evm_version = "cancun"
solc_version = "0.8.28"

# Suppress style lints for API/modifier names we don't control.
# block-timestamp: on Hedera, block.timestamp is the hashgraph consensus timestamp (median of node clocks),
# not a value a single block proposer chooses, so the miner-manipulation concern behind this lint does not apply.
[lint]
exclude_lints = ["mixed-case-variable", "mixed-case-function", "block-timestamp"]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
hedera_testnet = "https://testnet.hashio.io/api"
hedera_mainnet = "https://mainnet.hashio.io/api"

# Hedera is now supported on the main Sourcify instance (sourcify.dev).
# Use: forge verify-contract <ADDRESS> <CONTRACT> --chain-id 296 --verifier sourcify
# See: https://hedera.com/blog/smart-contract-verification-sourcify-dev-now-supported
[etherscan]
hedera_testnet = { key = "", url = "https://hashscan.io/testnet" }
hedera_mainnet = { key = "", url = "https://hashscan.io/mainnet" }

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

# See more config options https://book.getfoundry.sh/reference/config/overview
